<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Offline Kit Demo</title>
  <link rel="stylesheet" href="./assets/demo.css" />
</head>
<body>
  <main class="card">
    <p class="eyebrow">MCH5OfflineKit · 连通性测试包</p>
    <!-- 标题与状态由 js/demo.js 依据 location.protocol 判定后填充，绝不写死结论。 -->
    <h1 id="verdict">检测中…</h1>
    <p class="lead">
      这页不调 Native 桥、不打业务接口。判定依据是 <code>location.protocol</code>：
      命中离线包时入口会被改写成自定义 scheme，走线上回源时仍是 <code>https:</code>。
    </p>
    <ul class="status">
      <li>HTML <strong id="html-status">检测中</strong></li>
      <li id="css-status">CSS <strong>未生效</strong></li>
      <li>JS <strong id="js-status">未执行</strong></li>
      <li>图片 <strong id="img-status">加载中</strong></li>
      <li>离线包标记 <strong id="marker-status">未注入</strong></li>
    </ul>
    <!-- 图标随判定结果切换：未命中时不能还是个绿勾，否则「未命中」+绿勾是矛盾信号。 -->
    <div class="mark" id="mark" aria-hidden="true"></div>
    <p class="meta">location: <code id="loc"></code></p>
  </main>
  <script src="./js/demo.js"></script>
</body>
</html>
